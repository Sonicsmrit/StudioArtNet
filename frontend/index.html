<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Studio ArtNet</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- moving banner header -->
        <div class="banner">
            <div class = "banner-text">
                <span>Studio Art Net - Guess the Studio by their art snippet! Beat the AI who guesses the same</span>
            </div>
        </div>

        <main class = "main-content">

            <!-- leaderboard -->
            <nav class = "leader-Board">
                <div class = "leader-board-header">
                    <h2>Leaderboard</h2>
                </div>
            </nav>

            <!-- main image display screen -->
            <section class = "studio-art-snippet">
                <img src="../Test Data/Trigger/12821447.jpg" alt="Art Snippet"/>
            </section>

            

            <!-- ai pred and user pred -->

            <section class = "prediction-display">
                <div class = "ai-prediction">
                    <h3>AI Prediction</h3>
                    <p>Studio: MAPPA</p>
                </div>
                <div class = "user-prediction">
                    <h3>Your Prediction</h3>
                </div>
            </section>

        </main>
        <!-- studio button  -->
        <div class = "timer">
            <h3>Time Remaining: 20s</h3>
        </div>
        <section class = "studio-selection">
            <h3>Select a Studio</h3>
            <div class = "studio-options">
                <button>Bones</button>
                <button>Kyoto Animation</button>
                <button>Madhouse</button>
                <button>MAPPA</button>
                <button>Trigger</button>
                <button>Ufotable</button>
                <button>Wit Studio</button>
            </div>
        </section>
    </body>
</html>
