<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Studio ArtNet</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <!-- moving banner header -->
        <div class="banner">
            <div class = "banner-text">
                <span>Studio Art Net - Guess the Studio by their art snippet! Beat the AI who guesses the same || Notice: Since its on Render's Free Tier, the AI and Image loading might be slower than expected</span>
            </div>
        </div>

        <main class = "main-content">

            <!-- leaderboard -->
            <nav class = "leader-Board">
                <div class = "leader-board-header">
                    <h2>Leaderboard</h2>
                    <div id="leaderboard"></div>
                </div>
            </nav>

            <!-- main image display screen -->
            <section class = "studio-art-snippet"></section>

            

            <!-- ai pred and user pred -->

            <section class = "prediction-display">
                <div class = "ai-prediction">
                    <h3>AI Prediction</h3>
                    <div id="ai-prediction"></div>
                </div>
            </section>

        </main>
        <!-- studio button  -->

        <div class = "bottom">
            <div class="timer">
                <div class="timer-left"></div>
                <div class="timer-right"></div>
                <span id="timer-text">20</span>
            </div>
            <section class = "studio-selection">
                <h3>Select a Studio</h3>
                <div class = "studio-options">
                    <button value="Bones">Bones</button>
                    <button value="Kyoto Animation">Kyoto Animation</button>
                    <button value="Madhouse">Madhouse</button>
                    <button value="MAPPA">MAPPA</button>
                    <button value="Trigger">Trigger</button>
                    <button value="Ufotable">Ufotable</button>
                    <button value="Wit Studio">Wit Studio</button>
                </div>
            </section>

            <button class = "check">CHECK MY ANSWER</button>
            <div class="bottom">
                <div class="firework fw1"></div>
                <div class="firework fw2"></div>
                <div class="firework fw3"></div>
                <div class="firework fw4"></div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
